name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git log -1 --format=%b > notes.md
          gh release create "${TAG}" --title "${TAG}" --notes-file notes.md
